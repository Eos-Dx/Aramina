contract: aramina_measurement_uncertainty_v0_2
experiment:
  name: aramina_measurement_uncertainty_covariance_pilot
  model_name: aramina_target_breast_risk
  model_version: 0.2.14-beta
input:
  input_h5_path: data/combined_archive.h5
  model_joblib_path: models/aramina_target_breast_risk_0_2_14-beta_98526329f40d/model.joblib
data_version:
  contract: aramina_dvc_input_v0_1
  system: dvc
  dataset_id: aramina_combined_archive_h5
  dvc_version: 3.67.1
  pointer_path: data/combined_archive.h5.dvc
targets:
  mode: all_training_target_cases
  selected: []
covariance_monte_carlo:
  draws: 100
  seed: 20260825
  interval_quantiles: [0.025, 0.5, 0.975]
  convergence_draws: [25, 50, 100]
  convergence_tolerance: 0.005
covariance_model:
  estimation_draws: 20
  explained_variance: 0.995
  max_rank: 30
  minimum_diagonal_variance: 1.0e-12
  transfer_assumption: pooled_detector_mc_correlation_with_measurement_specific_pyfai_sigma
  provisional_gates:
    deterministic_parity_atol: 1.0e-12
    threshold_crossing_agreement_min: 0.95
    interval_width_ratio_min: 0.8
    interval_width_ratio_max: 1.25
    interval_endpoint_convergence_max: 0.005
detector_reference:
  draws: 20
  seed: 20260826
  snr_quantiles: 4
  max_cases_per_stratum: 1
  calibration_nuisance:
    enabled: false
    exclusion_reason: covariance_unavailable
    future_scope: shared_by_calib_session
  masked_pixel_policy: zero_masked_pixels_then_centered_poisson_on_positive_component
polar_cake:
  n_q: 256
  n_chi: 36
  parity_max_relative_rmse: 0.05
mlflow:
  enabled: true
  tracking_uri: sqlite:///examples/outputs/mlflow/aramina_measurement_uncertainty.db
  experiment_name: aramina_measurement_uncertainty
output:
  folder: examples/outputs/experiments/measurement_uncertainty
