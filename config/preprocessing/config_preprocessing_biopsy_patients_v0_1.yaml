extends:
- ./config/preprocessing/shared/aramina_policy_v0_1.yaml
- ./config/preprocessing/exclusions/agbh_quality_exclusions_t100_v0_1.yaml
- ./config/preprocessing/shared/aramina_pipeline_v0_1.yaml
- ./config/preprocessing/schema/model_input_columns_v0_1.yaml
aramina_preprocessing:
  name: aramina_biopsy_patients_model_input
  version: 0.1
  clinical_stage: research draft
data_version:
  contract: aramina_dvc_input_v0_1
  system: dvc
  dataset_id: aramina_combined_archive_h5
  dvc_version: 3.67.1
  pointer_path: data/combined_archive.h5.dvc
provenance:
  status: research draft biopsy-patients model-input preprocessing config
  canonical_location: config/preprocessing/config_preprocessing_biopsy_patients_v0_1.yaml
  product_filter_rule: keep patients with at least one biopsy row; include contralateral rows; NORMAL mapped to BENIGN; AgBH T100 monochromaticity exclusions
  quality_exclusion_reason_doc: ./docs/agbh_quality_exclusions.md
io:
  output_joblib_path: examples/outputs/model_input/aramina_biopsy_patients_model_input_v0_1.joblib
experiment:
  monochromaticity_threshold_factor: 1.0
  monochromaticity_max_score: 0.0075
  dataset_policy: biopsy_patients
  normal_policy: normal_as_benign
labels:
  product_column_builder:
    benign_values:
    - BENIGN
    - NORMAL
    normal_values: []
product_filter:
  require_biopsy_patient: true
