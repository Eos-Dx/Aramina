xrd_preprocessing:
  version: 0.1.8b0
  release_tag: v0.1.8-beta
io:
  input_h5_path: ./data/combined_archive.h5
raw_data:
  source: gfrm
  location: h5_blob
  allowed_sources:
  - gfrm
  h5_dataset_candidates:
    gfrm:
    - raw_file
    - artifacts/gfrm
filters:
  date_filter:
    enabled: false
    column: started_at
    op: date>=
    value: 2026-01-01
  measurement_positions:
  - P1
  - P2
  - P3
  required_q_max_nm_inv: 23.0
  require_sample_thickness_mm: true
  require_calibrant_thickness_mm: true
  calibrant_thickness_range_mm:
  - 2.0
  - 40.0
  thickness:
    sample:
      column: sample_thickness_mm
      require: true
      min_mm: 0.0
    calibrant:
      column: calibrant_thickness_mm
      require: true
      min_mm: 2.0
      max_mm: 40.0
labels:
  product_column_builder:
    cancer_values:
    - CANCER
    - ATYPICAL
    - PRE_CANCEROUS
    benign_values:
    - BENIGN
    normal_values:
    - NORMAL
  grouping:
    BENIGN: BENIGN
    CANCER: CANCER
    ATYPICAL: CANCER
    PRE_CANCEROUS: CANCER
    NORMAL: NORMAL
    NA: exclude
integration:
  npt: 100
  q_range_nm_inv:
  - 2.0
  - 23.0
  error_model: poisson
  thickness_correction:
    enabled: true
    sample_thickness_column: sample_thickness_mm
    calibrant_thickness_column: calibrant_thickness_mm
    require_sample_thickness: true
    require_calibrant_thickness: true
    calibrant_thickness_range_mm:
    - 2.0
    - 40.0
snr:
  method: poisson
  min_snr_db: 18.0
normalization:
  mode: value
  statistic: median
  q_range_nm_inv:
  - 6.7
  - 7.1
profile_gate:
  q_nm_inv: 14.0
  min_value: 2.0
product_filter:
  filter_by_specimen_status: true
  specimen_status_keep:
  - BENIGN
  - NORMAL
  - CANCER
  - ATYPICAL
  - PRE_CANCEROUS
  filter_by_product_status_group: true
  product_status_group_keep:
  - BENIGN
  - CANCER
  require_biopsy_rows: false
  require_biopsy_patient: false
  require_patient_pair: false
  patient_pair_keep: []
  min_measurements_per_specimen_after_snr: 1
  min_specimens_per_patient_after_snr: 1
