extends:
- shared/aramis_policy_v0_1.yaml
- exclusions/agbh_quality_exclusions_t100_v0_1.yaml
- shared/aramis_pipeline_v0_1.yaml
- outputs/model_input_output_v0_1.yaml
- cohorts/biopsy_patients_normal_as_benign_v0_1.yaml
aramis_preprocessing:
  name: aramis_biopsy_patients_model_input
  version: 0.1
  clinical_stage: research draft
provenance:
  status: research draft biopsy-patients model-input preprocessing config
  canonical_location: Aramis/config/preprocessing/aramis_biopsy_patients_model_input_v0_1.yaml
  cohort_rule: keep patients with at least one biopsy row; include contralateral rows; NORMAL mapped to BENIGN; AgBH T100 monochromaticity exclusions
  quality_exclusion_reason_doc: Aramis/docs/agbh_quality_exclusions.md
io:
  output_joblib_path: ../../examples/outputs/model_input/aramis_biopsy_patients_model_input_v0_1.joblib
experiment:
  monochromaticity_threshold_factor: 1.0
  monochromaticity_max_score: 0.0075
  dataset_policy: biopsy_patients
  normal_policy: normal_as_benign
cohort_settings:
  output_columns: []
