aramis_preprocessing:
  product: Aramis
  clinical_stage: research draft
  branch: one_to_one
  decision_unit: patientId
  row_unit: measurementId
  grouping_unit: specimenId
  cohort: standard
branch_settings:
  specimen_status_keep:
  - BENIGN
  - CANCER
  - NORMAL
  - ATYPICAL
  - PRE_CANCEROUS
  product_status_group_keep:
  - BENIGN
  - CANCER
  - NORMAL
  require_patient_pair: true
  patient_pair_keep:
  - - BENIGN
    - CANCER
  - - BENIGN
    - NORMAL
  - - CANCER
    - NORMAL
  patient_pair_exclude:
  - - BENIGN
    - BENIGN
  - - NORMAL
    - NORMAL
  - - CANCER
    - CANCER
  min_measurements_per_specimen_after_snr: 1
  min_specimens_per_patient_after_snr: 2
  require_biopsy: false
  require_biopsy_rows: false
  require_biopsy_patient: false
