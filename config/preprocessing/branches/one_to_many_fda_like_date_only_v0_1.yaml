aramis_preprocessing:
  product: Aramis
  clinical_stage: research draft
  branch: one_to_many
  decision_unit: specimenId
  row_unit: measurementId
  grouping_unit: specimenId
  cohort: fda_like_date_only
branch_settings:
  specimen_status_keep:
  - BENIGN
  - NORMAL
  - CANCER
  - ATYPICAL
  - PRE_CANCEROUS
  product_status_group_keep:
  - BENIGN
  - CANCER
  require_patient_pair: false
  patient_pair_keep: []
  patient_pair_exclude: []
  min_measurements_per_specimen_after_snr: 1
  min_specimens_per_patient_after_snr: 1
  require_biopsy: true
  require_biopsy_rows: true
  require_biopsy_patient: false
labels:
  product_column_builder:
    benign_values:
    - BENIGN
    - NORMAL
    normal_values: []
filters:
  date_filter:
    enabled: true
    column: started_at
    op: date>=
    value: 2026-01-01
  quality_exclusions:
    enabled: false
    primary_key:
      excluded_values: []
    fallback_date:
      excluded_dates: []
