extends:
- ./config/preprocessing/shared/aramina_policy_v0_1.yaml
- ./config/preprocessing/shared/aramina_pipeline_v0_1.yaml
- ./config/preprocessing/schema/prediction_input_columns_v0_1.yaml
aramina_preprocessing:
  name: aramina_prediction_patient_model_input
  version: 0.1
  clinical_stage: research draft
provenance:
  status: research draft prediction preprocessing config
  canonical_location: config/preprocessing/config_preprocessing_prediction_patient_v0_1.yaml
  product_filter_rule: one incoming patient H5; no historical date, diagnosis, biopsy, or AgBH exclusion filters
  clinical_safety_note: Decision-support preprocessing only; not autonomous diagnosis.
io:
  input_h5_path: INPUT_H5_PATH_SET_BY_PREDICTION_CONFIG
  output_joblib_path: examples/outputs/prediction/aramina_prediction_patient_model_input_v0_1.joblib
filters:
  date_filter:
    enabled: false
  quality_exclusions:
    enabled: false
    primary_key:
      excluded_values: []
    fallback_date:
      excluded_dates: []
product_filter:
  filter_by_specimen_status: false
  specimen_status_keep: []
  filter_by_product_status_group: false
  product_status_group_keep: []
  require_biopsy_rows: false
  require_biopsy_patient: false
  require_patient_pair: false
  patient_pair_keep: []
