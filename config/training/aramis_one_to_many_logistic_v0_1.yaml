training:
  name: aramis_one_to_many_logistic
  version: 0.1
  branch: one_to_many
  clinical_stage: research draft
  intended_use: decision-support p_cancer research draft; requires radiologist review

io:
  input_dataframe_joblib_path: ../../examples/outputs/aramis_one_to_many_benign_cancer_dataframe.joblib
  output_model_joblib_path: ../../examples/outputs/aramis_one_to_many_logistic_model.joblib

model:
  type: logistic_regression
  profile_column: radial_profile_data
  label_column: product_status_group
  group_column: patientId
  specimen_column: specimenId
  logreg_c: 1.0

evaluation:
  n_splits: 20
  test_size: 0.30
  random_state: 42
  inner_splits: 5
  target_sensitivity: 0.95
  aggregation: mean
