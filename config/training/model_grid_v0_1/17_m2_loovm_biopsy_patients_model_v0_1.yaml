training:
  name: 17_m2_loovm_biopsy_patients_model_v0_1
  version: 0.1
  branch: one_to_many
  clinical_stage: research draft
  intended_use: decision-support p_cancer research draft; requires radiologist review
io:
  input_dataframe_joblib_path: ../../../examples/outputs/model_input/aramis_biopsy_patients_model_input_v0_1.joblib
  output_model_joblib_path: ../../../examples/outputs/training/model_grid/17_m2_loovm_biopsy_patients_model_v0_1.joblib
  output_json_path: ../../../examples/outputs/training/model_grid/17_m2_loovm_biopsy_patients_model_v0_1_summary.json
  output_yaml_path: ../../../examples/outputs/training/model_grid/17_m2_loovm_biopsy_patients_model_v0_1_description.yaml
model:
  type: patient_m0_m1_m2_logistic_set
  selected_models:
  - M2
  profile_column: radial_profile_data
  label_column: product_status_group
  group_column: patientId
  specimen_column: specimenId
  side_column: side
  age_column: age
  biopsy_column: biopsy
  lr1_row_policy: biopsy_only
  logreg_c: 1.0
evaluation:
  mode: loovm
  random_state: 42
  target_sensitivity: 0.95
