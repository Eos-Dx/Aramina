[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aramina"
version = "0.2.12b0"
description = "Aramina breast-XRD clinical decision-support research draft."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "EOS" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "h5py>=3.10",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "xrd-preprocessing @ git+https://github.com/Eos-Dx/XRD-preprocessing.git@18ddac4be429e612ac82f8e81605d98399acee02",
]

[project.scripts]
aramina = "aramina.__main__:main"

[project.optional-dependencies]
api = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "python-multipart>=0.0.20,<1",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=7.0",
  "ruff>=0.8",
  "marimo>=0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aramina"]

[tool.hatch.build.targets.wheel.force-include]
"config/preprocessing" = "aramina/config/preprocessing"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
