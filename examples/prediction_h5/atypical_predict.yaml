  version: 0.1
  clinical_stage: research draft
  intended_use: decision-support p_cancer research draft; requires radiologist review

io:
  input_h5_path: atypical_one_patient.h5
  output_dataframe_joblib_path: ../outputs/prediction_h5_examples/atypical_prediction_df.joblib
  input_model_joblib_path: ../outputs/training/aramis_m1q_t100_train_all_c0p1.joblib
  output_json_path: ../outputs/prediction_h5_examples/atypical_report.json
