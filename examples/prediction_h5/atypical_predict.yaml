preprocessing:
  config_path: aramis_prediction_patient_raw_h5_example_v0_1.yaml

container:
  schema_version: "0.3"
  format: xrd-session
  max_patients: 1

patient:
  patient_id: PRED_ATYPICAL
  target_side: Left

model:
  model_id: aramis_m1q_t100_train_all_c0p1
