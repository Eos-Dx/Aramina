prediction:
  name: aramis_predict_benign_example
  version: 0.1
  clinical_stage: research draft
  intended_use: decision-support p_cancer research draft; requires radiologist review

io:
  input_h5_path: benign_one_patient.h5
  output_dataframe_joblib_path: ../outputs/prediction_h5_examples/benign_prediction_df.joblib
  input_model_joblib_path: ../outputs/training/aramis_m1q_t100_train_all_c0p1.joblib
  output_external_json_path: ../outputs/prediction_h5_examples/benign_external_report.json
  output_external_yaml_path: ../outputs/prediction_h5_examples/benign_external_report.yaml
  output_internal_json_path: ../outputs/prediction_h5_examples/benign_internal_report.json
  output_internal_yaml_path: ../outputs/prediction_h5_examples/benign_internal_report.yaml

reporting:
  external_report:
    version: "0.1"
    reference_doc: ../../docs/modeling/prediction_pipeline_v0_1.md
  internal_report:
    version: "0.1"
    reference_doc: ../../docs/modeling/internal_clinical_report_content_v0_1.md

preprocessing:
  config_path: aramis_prediction_patient_raw_h5_example_v0_1.yaml

container:
  schema_version: "0.3"
  format: xrd-session
  max_patients: 1

patient:
  patient_id: PRED_BENIGN
  target_side: Left

model:
  model_id: aramis_m1q_t100_train_all_c0p1
  selected_model: M1Q

decision:
  threshold_key: threshold_target
