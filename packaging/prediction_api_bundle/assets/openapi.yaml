openapi: 3.1.0
info:
  title: Aramina Immutable Prediction API
  version: '0.1'
  description: One-patient local research-draft Aramina prediction service.
paths:
  /health:
    get:
      summary: Check service readiness
      responses:
        '200':
          description: Model artifact is available.
          content:
            application/json:
              schema:
                type: object
                required: [status, model_artifact]
                properties:
                  status: {type: string, example: ready}
                  model_artifact: {type: string, example: model.joblib}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /predict:
    post:
      summary: Predict one clinician-selected target breast
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [input_h5, request_json]
              properties:
                input_h5:
                  type: string
                  format: binary
                  description: One EOS H5 v0.3 xrd-session container.
                request_json:
                  type: string
                  description: JSON string following PredictionRequest.
      responses:
        '200':
          description: External and internal report payloads.
          content:
            application/json:
              schema:
                type: object
                required: [external_report, internal_report]
                properties:
                  external_report: {type: object, additionalProperties: true}
                  internal_report: {type: object, additionalProperties: true}
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    PredictionRequest:
      type: object
      required: [analysis_author, patient_id, target_side]
      additionalProperties: false
      properties:
        analysis_author: {type: string, minLength: 1}
        prediction_comment: {type: string}
        patient_id: {type: string, minLength: 1}
        target_side: {type: string, enum: [left, right]}
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
  responses:
    BadRequest:
      description: Request or prediction input did not meet contract.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: Immutable model artifact unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
