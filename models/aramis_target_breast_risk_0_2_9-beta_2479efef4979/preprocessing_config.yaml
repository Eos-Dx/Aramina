xrd_preprocessing:
  version: local
  release_tag: v0.1.7-beta
io:
  input_h5_path: ./data/combined_archive.h5
  output_joblib_path: examples/outputs/model_input/aramis_biopsy_patients_model_input_v0_1.joblib
raw_data:
  source: gfrm
  location: h5_blob
  allowed_sources:
  - gfrm
  h5_dataset_candidates:
    gfrm:
    - raw_file
    - artifacts/gfrm
filters:
  date_filter:
    enabled: false
    column: started_at
    op: date>=
    value: 2026-01-01
  measurement_positions:
  - P1
  - P2
  - P3
  required_q_max_nm_inv: 23.0
  require_sample_thickness_mm: true
  require_calibrant_thickness_mm: true
  calibrant_thickness_range_mm:
  - 2.0
  - 40.0
  thickness:
    sample:
      column: sample_thickness_mm
      require: true
      min_mm: 0.0
    calibrant:
      column: calibrant_thickness_mm
      require: true
      min_mm: 2.0
      max_mm: 40.0
  quality_exclusions:
    enabled: true
    reason_doc: Aramis/docs/agbh_quality_exclusions.md
    monochromaticity_max_score: 0.0075
    primary_key:
      column: linked_agbh_session_uid
      excluded_values:
      - 0fdc28d4-b3f3-587d-b249-3bbd58521cdf
      - 1969e37b-f7e7-52eb-b37b-5d695ef88518
      - 255ab836-9dc0-56f6-87d6-dfdd53194b79
      - 2e8ad4c3-c179-5fdb-bbc4-08527d5eb610
      - 32b19b43-c2af-5957-8c12-b1fc8adf95a6
      - 353530a4-3115-5cee-9b60-2c01f7faf15e
      - 368413bd-63d3-5f33-a42f-f951b1cb5c43
      - 40e0108e-2b6c-5df8-8ae8-07e34d1895ab
      - 41ef39ad-6291-5f89-b2f7-4e963b7c2708
      - 4e9159a7-c442-5370-9eaf-2f5ddb2e57e8
      - 5efc0a25-14fa-55d2-9571-6088e19e1601
      - 67b6314d-c10d-5304-9186-b2d914b6f7a2
      - 68cb4c17-8285-5fdc-a1e8-37b0aaa244cc
      - 6dc7bc4f-2253-50d6-beaf-bb190ae188c4
      - 738fb0d5-1343-538e-8e52-a2176bd4e5fc
      - 88b84905-9515-5535-b329-6b48565774d6
      - 8a2f8e64-40c1-5433-892a-551f4155ce16
      - 98adb47e-3e18-5094-80df-405a0359b26f
      - 9e170b57-71e1-59b0-ae62-ac2c514423e8
      - a0ff9f95-008c-5f2f-bec9-25eff5ed3113
      - aa3fc614-ea39-582a-9600-f832b158ad1f
      - b0a0e71c-9e8b-52a4-a959-4305e8f5e282
      - b96671e6-3ee3-5097-8cd1-2a4ddc26b7cc
      - b9e40c15-3acf-517c-864f-18fdfb83aefa
      - bb7caf51-23a3-55fc-a722-d36dca9c4103
      - c6a53d12-9e25-5dac-95e2-398a0ca57f01
      - cab11798-3c7e-5370-ad1d-346a350ad3bd
      - dc620531-6c85-56f5-b7b7-8a921bea6202
      - f9873da1-241b-5ac7-ad26-df842216599c
      - fa6be5c1-268f-5527-ae43-6d507313b387
      - fb057641-d05a-5642-8c38-8663a9b20179
    fallback_date:
      column: started_at
      excluded_dates:
      - '2025-04-09'
      - '2025-04-14'
      - '2025-04-15'
      - '2025-04-16'
      - '2025-04-17'
      - '2025-04-23'
      - '2025-05-07'
      - '2025-09-29'
      - '2026-01-07'
      - '2026-01-08'
      - '2026-01-09'
      - '2026-01-13'
      - '2026-01-14'
      - '2026-01-15'
      - '2026-01-16'
      - '2026-01-20'
      - '2026-01-21'
      - '2026-01-22'
      - '2026-01-23'
      - '2026-01-26'
      - '2026-02-17'
      - '2026-02-19'
      - '2026-02-24'
      - '2026-02-25'
      - '2026-02-27'
      - '2026-03-02'
      - '2026-03-03'
      - '2026-03-10'
      - '2026-03-16'
      - '2026-03-23'
      use_when_primary_key_missing: true
labels:
  product_column_builder:
    cancer_values:
    - CANCER
    - ATYPICAL
    - PRE_CANCEROUS
    benign_values:
    - BENIGN
    - NORMAL
    normal_values: []
  grouping:
    BENIGN: BENIGN
    CANCER: CANCER
    ATYPICAL: CANCER
    PRE_CANCEROUS: CANCER
    NORMAL: NORMAL
    NA: exclude
integration:
  npt: 100
  q_range_nm_inv:
  - 2.0
  - 23.0
  error_model: poisson
  thickness_correction:
    enabled: true
    sample_thickness_column: sample_thickness_mm
    calibrant_thickness_column: calibrant_thickness_mm
    require_sample_thickness: true
    require_calibrant_thickness: true
    calibrant_thickness_range_mm:
    - 2.0
    - 40.0
snr:
  method: poisson
  min_snr_db: 18.0
normalization:
  mode: value
  statistic: median
  q_range_nm_inv:
  - 6.7
  - 7.1
  save_initial_data: false
profile_gate:
  q_nm_inv: 14.0
  min_value: 2.0
product_filter:
  filter_by_specimen_status: true
  specimen_status_keep:
  - BENIGN
  - NORMAL
  - CANCER
  - ATYPICAL
  - PRE_CANCEROUS
  filter_by_product_status_group: true
  product_status_group_keep:
  - BENIGN
  - CANCER
  require_biopsy_rows: false
  require_biopsy_patient: true
  require_patient_pair: false
  patient_pair_keep: []
  min_measurements_per_specimen_after_snr: 1
  min_specimens_per_patient_after_snr: 1
pipeline:
  steps:
  - name: poni_geometry
    transformer: H5PoniGeometryCalculatorTransformer
    params: {}
  - name: select_h5_sessions
    transformer: H5SessionSelectorTransformer
    params:
      session_category: SAMPLE
      filters:
      - enabled:
          $ref: filters.date_filter.enabled
        column:
          $ref: filters.date_filter.column
        op:
          $ref: filters.date_filter.op
        value:
          $ref: filters.date_filter.value
      - column: linked_agbh_session_uid
        enabled:
          $ref: filters.quality_exclusions.enabled
        op: not in
        values:
          $ref: filters.quality_exclusions.primary_key.excluded_values
        fallback:
          column: started_at
          op: date not in
          values:
            $ref: filters.quality_exclusions.fallback_date.excluded_dates
      - enabled:
          $ref: product_filter.require_biopsy_rows
        column: biopsy
        op: ==
        value: true
      - enabled:
          $ref: product_filter.filter_by_specimen_status
        column: specimen_status
        op: in
        values:
          $ref: product_filter.specimen_status_keep
      - column: calibrant_thickness_mm
        op: notna
      - column: calibrant_thickness_mm
        op: '>='
        value:
          $ref: filters.calibrant_thickness_range_mm.0
      - column: calibrant_thickness_mm
        op: <=
        value:
          $ref: filters.calibrant_thickness_range_mm.1
      - column: poni_q_max_nm_inv
        op: '>='
        value:
          $ref: filters.required_q_max_nm_inv
  - name: h5_to_df
    transformer: H5ToDataFrameTransformer
    params:
      data_preference:
        $ref: raw_data.source
      drop_missing_sample_thickness:
        $ref: filters.require_sample_thickness_mm
      session_category: SAMPLE
      set_category: SAMPLE
      measurement_filters:
      - column: position
        op: in
        values:
          $ref: filters.measurement_positions
  - name: product_columns
    transformer: ProductColumnBuilder
    params:
      cancer_values:
        $ref: labels.product_column_builder.cancer_values
      benign_values:
        $ref: labels.product_column_builder.benign_values
      normal_values:
        $ref: labels.product_column_builder.normal_values
  - name: position_filter
    transformer: ColumnValueFilter
    params:
      column: position
      op: in
      values:
        $ref: filters.measurement_positions
  - name: sample_thickness_filter
    transformer: ColumnValueFilter
    params:
      column:
        $ref: filters.thickness.sample.column
      op: '>'
      value:
        $ref: filters.thickness.sample.min_mm
  - name: calibrant_thickness_filter
    transformer: ColumnValueFilter
    params:
      column:
        $ref: filters.thickness.calibrant.column
      op: between
      lower:
        $ref: filters.thickness.calibrant.min_mm
      upper:
        $ref: filters.thickness.calibrant.max_mm
  - name: biopsy_filter
    transformer: ColumnValueFilter
    enabled:
      $ref: product_filter.require_biopsy_rows
    params:
      column: biopsy
      op: ==
      value: true
  - name: patient_biopsy_filter
    transformer: GroupValueFilter
    enabled:
      $ref: product_filter.require_biopsy_patient
    params:
      group_column: patientId
      column: biopsy
      op: ==
      value: true
  - name: specimen_status_filter
    transformer: ColumnValueFilter
    enabled:
      $ref: product_filter.filter_by_specimen_status
    params:
      column: specimen_status
      op: in
      values:
        $ref: product_filter.specimen_status_keep
  - name: product_status_filter
    transformer: ProductStatusGroupFilter
    enabled:
      $ref: product_filter.filter_by_product_status_group
    params:
      allowed:
        $ref: product_filter.product_status_group_keep
  - name: paired_patient_filter
    transformer: PairedGroupFilter
    enabled:
      $ref: product_filter.require_patient_pair
    params:
      allowed_pairs:
        $ref: product_filter.patient_pair_keep
  - name: faulty_pixels
    transformer: FaultyPixelDetector
    params:
      bright_pixel_min_value: 500.0
      exclude_beam_center_radius: 0.04
  - name: interpolation_q_range
    transformer: ConstantQRangeTransformer
    params:
      q_min:
        $ref: integration.q_range_nm_inv.0
      q_max:
        $ref: integration.q_range_nm_inv.1
  - name: azimuthal_integration
    transformer: AzimuthalIntegration
    params:
      npt:
        $ref: integration.npt
      calibration_mode: poni
      mask_column: faulty_pixel_mask
      error_model:
        $ref: integration.error_model
      thickness_adjustment:
        $ref: integration.thickness_correction.enabled
      require_thickness_adjustment:
        $ref: integration.thickness_correction.enabled
      sample_thickness_column:
        $ref: integration.thickness_correction.sample_thickness_column
      thickness_reference_column:
        $ref: integration.thickness_correction.calibrant_thickness_column
  - name: snr
    transformer: SNRTransformer
    params:
      snr_method:
        $ref: snr.method
  - name: snr_filter
    transformer: SNRFilter
    params:
      min_snr_db:
        $ref: snr.min_snr_db
  - name: specimen_validity
    transformer: PatientSpecimenValidityFilter
    params:
      min_measurements_per_specimen:
        $ref: product_filter.min_measurements_per_specimen_after_snr
      min_specimens_per_patient:
        $ref: product_filter.min_specimens_per_patient_after_snr
  - name: normalization
    transformer: QRangeValueNormalizer
    params:
      q_min:
        $ref: normalization.q_range_nm_inv.0
      q_max:
        $ref: normalization.q_range_nm_inv.1
      statistic:
        $ref: normalization.statistic
      save_initial_data:
        $ref: normalization.save_initial_data
  - name: profile_gate
    transformer: RadialProfileValueFilter
    params:
      q_value_nm_inv:
        $ref: profile_gate.q_nm_inv
      threshold:
        $ref: profile_gate.min_value
      op: '>'
  - name: keep_columns
    transformer: KeepColumnsTransformer
    params:
      columns:
        $ref: metadata.output_columns
      errors:
        $ref: metadata.keep_columns_errors
metadata:
  keep_columns_errors: raise
  output_columns:
  - patientId
  - specimenId
  - side
  - position
  - started_at
  - measurementDate
  - specimen_status
  - product_status_group
  - product_diagnosis
  - patient_product_diagnosis
  - age
  - biopsy
  - sample_biopsy
  - sample_biopsy_type
  - sample_height_in
  - sample_weight_lb
  - breast_density
  - birads
  - sample_thickness_mm
  - calibrant_thickness_mm
  - poni_q_max_nm_inv
  - measurement_data_source
  - q_range
  - radial_profile_data
  - snr_db
  - specimen_measurement_count
  - radial_profile_value_at_q
  - radial_profile_nearest_q_nm_inv
  - radial_profile_q_delta_nm_inv
  - radial_profile_value_pass
aramis_preprocessing:
  name: aramis_biopsy_patients_model_input
  version: 0.1
  clinical_stage: research draft
provenance:
  status: research draft biopsy-patients model-input preprocessing config
  canonical_location: config/preprocessing/config_preprocessing_biopsy_patients_v0_1.yaml
  product_filter_rule: keep patients with at least one biopsy row; include contralateral
    rows; NORMAL mapped to BENIGN; AgBH T100 monochromaticity exclusions
  quality_exclusion_reason_doc: ./docs/agbh_quality_exclusions.md
experiment:
  monochromaticity_threshold_factor: 1.0
  monochromaticity_max_score: 0.0075
  dataset_policy: biopsy_patients
  normal_policy: normal_as_benign
